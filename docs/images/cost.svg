<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="예상 월 비용. 고정비 약 8 USD, Bedrock 상한 약 1.7 USD, 예산 알림 계정 20 USD와 Bedrock 10 USD">
  <title>예상 월 비용. 고정비 약 8 USD, Bedrock 상한 약 1.7 USD, 예산 알림 계정 20 USD와 Bedrock 10 USD</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1B2E"/><stop offset="0.62" stop-color="#0B1D2D"/><stop offset="1" stop-color="#0B2422"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4C4D8"/>
    </marker>
    <marker id="arrLater" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8DA3BE"/>
    </marker>
    <symbol id="flake" viewBox="-10 -10 20 20" overflow="visible"><g fill="none" stroke-width="1.3" stroke-linecap="round"><g transform="rotate(0)"><path d="M0,-9 V9"/><path d="M-2.6,-7.4 L0,-5 L2.6,-7.4"/><path d="M-2.6,7.4 L0,5 L2.6,7.4"/></g><g transform="rotate(60)"><path d="M0,-9 V9"/><path d="M-2.6,-7.4 L0,-5 L2.6,-7.4"/><path d="M-2.6,7.4 L0,5 L2.6,7.4"/></g><g transform="rotate(120)"><path d="M0,-9 V9"/><path d="M-2.6,-7.4 L0,-5 L2.6,-7.4"/><path d="M-2.6,7.4 L0,5 L2.6,7.4"/></g></g></symbol>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#E9B949" fill-opacity="0.18"/>
      <rect width="3" height="8" fill="#E9B949" fill-opacity="0.6"/>
    </pattern>
    <pattern id="hatchAi" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#8ECDF5" fill-opacity="0.15"/>
      <rect width="3" height="8" fill="#8ECDF5" fill-opacity="0.6"/>
    </pattern>
    <style>
      text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', system-ui, sans-serif; }
      text:not([fill]) { fill: #F5F8FC; }
      .card { fill: #12263F; stroke: #1E3A5C; stroke-width: 1.5; }
      .inner { fill: #183152; stroke: #2B4A70; stroke-width: 1; }
      .ghost { fill: #0C1B2E; stroke: #8DA3BE; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .h { font-size: 17px; font-weight: 700; }
      .s { font-size: 14px; fill: #B4C4D8; }
      .xs { font-size: 14px; fill: #B4C4D8; }
      .code { font-family: ui-monospace, 'SF Mono', 'D2Coding', Consolas, 'Liberation Mono', monospace; font-size: 14px; fill: #8ECDF5; }
      .line { stroke: #B4C4D8; stroke-width: 2; fill: none; }
      .later { stroke: #8DA3BE; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
      .lb { font-size: 16px; font-weight: 700; }
      .sub { font-size: 14px; fill: #B4C4D8; }
      .val { font-size: 16px; font-weight: 800; }
      .track { fill: #F5F8FC; fill-opacity: 0.05; }
      .grid { stroke: #F5F8FC; stroke-opacity: 0.08; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <path d="M0,596 Q300,580 600,592 T1200,590 V596 A24,24 0 0 1 1176,620 H24 A24,24 0 0 1 0,596 z" fill="#F5F8FC" opacity="0.05"/>
  <g fill="#F5F8FC"><circle cx="1176" cy="300" r="1.3" opacity="0.3"/><circle cx="24" cy="330" r="1.2" opacity="0.3"/></g>
  <path d="M40,0 H64 V56 L52,47 L40,56 z" fill="#B5123E"/>
  <path d="M43.5,0 V50 M60.5,0 V50" stroke="#E9B949" stroke-width="1" opacity="0.75"/>
  <text x="82" y="48" font-size="28" font-weight="800">예상 월 비용</text>
  <text x="1160" y="48" text-anchor="end" font-size="16" fill="#B4C4D8">USD, dev 한 환경 기준. 빗금은 범위나 추정</text>
  <g transform="translate(0,20)">
  <!-- 1 USD = 80px, x0 = 290 -->
  <rect class="card" x="40" y="86" width="720" height="484" rx="18"/>
  <g class="grid">
    <line x1="290" y1="108" x2="290" y2="510"/><line x1="370" y1="108" x2="370" y2="510"/>
    <line x1="450" y1="108" x2="450" y2="510"/><line x1="530" y1="108" x2="530" y2="510"/>
    <line x1="610" y1="108" x2="610" y2="510"/><line x1="690" y1="108" x2="690" y2="510"/>
  </g>
  <g class="sub" text-anchor="middle">
    <text x="290" y="536">0</text><text x="370" y="536">1</text><text x="450" y="536">2</text>
    <text x="530" y="536">3</text><text x="610" y="536">4</text><text x="690" y="536">5</text>
  </g>

  <text class="lb" x="64" y="130">Lightsail 인스턴스</text><text class="sub" x="64" y="150">nano_3_0 512MB × 1</text>
  <rect class="track" x="290" y="118" width="440" height="28" rx="8"/>
  <rect x="290" y="118" width="400" height="28" rx="8" fill="#E9B949"/>
  <text x="674" y="138" text-anchor="end" font-size="16" font-weight="800" fill="#08121F">5</text>

  <text class="lb" x="64" y="186">KMS 키</text><text class="sub" x="64" y="206">dev, main 2개. 철거 후 7일</text>
  <rect class="track" x="290" y="174" width="440" height="28" rx="8"/>
  <rect x="290" y="174" width="160" height="28" rx="8" fill="#E9B949"/>
  <text class="val" x="462" y="194">약 2</text>

  <text class="lb" x="64" y="242">자동 스냅숏</text><text class="sub" x="64" y="262">증분, 추정</text>
  <rect class="track" x="290" y="230" width="440" height="28" rx="8"/>
  <rect x="290" y="230" width="40" height="28" rx="8" fill="url(#hatch)"/>
  <rect x="290" y="230" width="20" height="28" rx="6" fill="#E9B949"/>
  <text class="val" x="342" y="250">약 0.5</text>

  <text class="lb" x="64" y="298">Route 53</text><text class="sub" x="64" y="318">도메인 전. 산 뒤 0.5</text>
  <rect class="track" x="290" y="286" width="440" height="28" rx="8"/>
  <text class="val" x="302" y="306" fill="#4CC38A">0</text>

  <text class="lb" x="64" y="354">S3</text><text class="sub" x="64" y="374">상태, 백업, 설정</text>
  <rect class="track" x="290" y="342" width="440" height="28" rx="8"/>
  <rect x="290" y="342" width="80" height="28" rx="8" fill="url(#hatch)"/>
  <text class="val" x="382" y="362">1 미만</text>

  <text class="lb" x="64" y="410">GitHub Actions</text><text class="sub" x="64" y="430">공개 레포 무료</text>
  <rect class="track" x="290" y="398" width="440" height="28" rx="8"/>
  <text class="val" x="302" y="418" fill="#4CC38A">0</text>

  <line x1="64" y1="446" x2="736" y2="446" stroke="#2B4A70" stroke-dasharray="4 4"/>
  <text class="lb" x="64" y="474">Bedrock 상한</text><text class="sub" x="64" y="494">Haiku 5.5, 추정</text>
  <rect class="track" x="290" y="462" width="440" height="28" rx="8"/>
  <rect x="290" y="462" width="136" height="28" rx="8" fill="url(#hatchAi)"/>
  <rect x="290" y="462" width="80" height="28" rx="8" fill="#8ECDF5"/>
  <text class="val" x="438" y="482">약 1.7</text>
  <text class="sub" x="510" y="482">하루 100회 × 30일 × 1환경</text>

  <!-- summary: gift-box card with ribbon -->
  <rect x="790" y="86" width="370" height="200" rx="18" fill="#B5123E" fill-opacity="0.16" stroke="#FF7A93" stroke-opacity="0.6"/>
  <rect x="1104" y="86" width="22" height="200" fill="#B5123E" fill-opacity="0.85"/>
  <path d="M1107.5,86 V286 M1122.5,86 V286" stroke="#E9B949" stroke-width="1" opacity="0.7"/>
  <text x="818" y="126" font-size="16" font-weight="700" fill="#F7DE9F">고정비 합계</text>
  <text x="818" y="196" font-size="56" font-weight="800" letter-spacing="-1">약 8</text>
  <text x="944" y="196" font-size="20" font-weight="700" fill="#F7DE9F">USD/월</text>
  <text class="sub" x="818" y="236">도메인과 main을 켜면 약 14~15.</text>
  <text class="sub" x="818" y="260">12/31 종료 후 철거한다.</text>

  <rect class="card" x="790" y="306" width="370" height="264" rx="18"/>
  <text x="818" y="344" font-size="16" font-weight="700">예산 알림</text>
  <text class="sub" x="818" y="376">계정 전체</text>
  <text class="val" x="1132" y="376" text-anchor="end">20 USD</text>
  <!-- 20 USD = 316px -->
  <rect x="818" y="390" width="316" height="22" rx="11" fill="#F5F8FC" fill-opacity="0.06"/>
  <rect x="818" y="390" width="126" height="22" rx="11" fill="#E9B949"/>
  <rect x="944" y="390" width="158" height="22" fill="#8ECDF5"/>
  <text class="sub" x="818" y="436">고정비 8</text>
  <text class="sub" x="990" y="436">Bedrock 10</text>

  <text class="sub" x="818" y="476">Bedrock 전용</text>
  <text class="val" x="1132" y="476" text-anchor="end">10 USD</text>
  <rect x="818" y="490" width="316" height="22" rx="11" fill="#F5F8FC" fill-opacity="0.06"/>
  <rect x="818" y="490" width="54" height="22" rx="11" fill="url(#hatchAi)"/>
  <text class="sub" x="818" y="540">상한 1.7 추정. 100%를 넘으면</text>
  <text class="sub" x="818" y="558">거부 정책 자동 부착(선택)</text>
  </g>
</svg>
