<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="예상 월 비용">
  <title>예상 월 비용</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1426"/><stop offset="1" stop-color="#0F1F33"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9900"/><stop offset="1" stop-color="#F5B83D"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C6CFF"/><stop offset="1" stop-color="#3E8BFF"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#F5B83D" fill-opacity="0.18"/>
      <rect width="3" height="8" fill="#F5B83D" fill-opacity="0.55"/>
    </pattern>
    <pattern id="hatchAi" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#9C8CFF" fill-opacity="0.18"/>
      <rect width="3" height="8" fill="#9C8CFF" fill-opacity="0.6"/>
    </pattern>
    <style>
      text { font-family: Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif; fill: #E6EDF7; }
      .card { fill: #16233B; stroke: #2A3B5A; stroke-width: 1.5; }
      .lb { font-size: 16px; font-weight: 700; }
      .sub { font-size: 14px; fill: #8FA3BF; }
      .val { font-size: 16px; font-weight: 800; }
      .track { fill: #FFFFFF; fill-opacity: 0.05; }
      .grid { stroke: #FFFFFF; stroke-opacity: 0.07; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="600" rx="24" fill="url(#bg)"/>
  <text x="40" y="56" font-size="28" font-weight="800">예상 월 비용</text>
  <text x="214" y="56" class="sub" font-size="16">USD · dev 한 환경 · 빗금은 범위나 추정</text>

  <!-- 막대 차트: 1 USD = 80px, 시작 x=290 -->
  <rect class="card" x="40" y="86" width="720" height="484" rx="18"/>
  <g class="grid">
    <line x1="290" y1="108" x2="290" y2="510"/><line x1="370" y1="108" x2="370" y2="510"/>
    <line x1="450" y1="108" x2="450" y2="510"/><line x1="530" y1="108" x2="530" y2="510"/>
    <line x1="610" y1="108" x2="610" y2="510"/><line x1="690" y1="108" x2="690" y2="510"/>
  </g>
  <g class="sub" text-anchor="middle">
    <text x="290" y="536">0</text><text x="370" y="536">1</text><text x="450" y="536">2</text>
    <text x="530" y="536">3</text><text x="610" y="536">4</text><text x="690" y="536">5</text>
  </g>

  <text class="lb" x="64" y="134">Lightsail 인스턴스</text><text class="sub" x="64" y="154">nano 512MB × 1</text>
  <rect class="track" x="290" y="122" width="440" height="28" rx="8"/>
  <rect x="290" y="122" width="400" height="28" rx="8" fill="url(#bar)"/>
  <text x="674" y="142" text-anchor="end" font-size="16" font-weight="800" fill="#0B1426">5</text>

  <text class="lb" x="64" y="198">자동 스냅숏</text><text class="sub" x="64" y="218">증분 · 추정</text>
  <rect class="track" x="290" y="186" width="440" height="28" rx="8"/>
  <rect x="290" y="186" width="40" height="28" rx="8" fill="url(#hatch)"/>
  <rect x="290" y="186" width="20" height="28" rx="6" fill="#F5B83D"/>
  <text class="val" x="342" y="206">약 0.5</text>

  <text class="lb" x="64" y="262">Route 53</text><text class="sub" x="64" y="282">도메인 전 · 산 뒤 0.5</text>
  <rect class="track" x="290" y="250" width="440" height="28" rx="8"/>
  <text class="val" x="302" y="270" fill="#3DDC97">0</text>

  <text class="lb" x="64" y="326">S3</text><text class="sub" x="64" y="346">상태 · 백업</text>
  <rect class="track" x="290" y="314" width="440" height="28" rx="8"/>
  <rect x="290" y="314" width="80" height="28" rx="8" fill="url(#hatch)"/>
  <text class="val" x="382" y="334">1 미만</text>

  <text class="lb" x="64" y="390">GitHub Actions</text><text class="sub" x="64" y="410">공개 레포 무료</text>
  <rect class="track" x="290" y="378" width="440" height="28" rx="8"/>
  <text class="val" x="302" y="398" fill="#3DDC97">0</text>

  <line x1="64" y1="432" x2="736" y2="432" stroke="#2A3B5A" stroke-dasharray="4 4"/>
  <text class="lb" x="64" y="466">Bedrock 상한</text><text class="sub" x="64" y="486">Haiku 5.5 · 추정</text>
  <rect class="track" x="290" y="454" width="440" height="28" rx="8"/>
  <rect x="290" y="454" width="136" height="28" rx="8" fill="url(#hatchAi)"/>
  <rect x="290" y="454" width="80" height="28" rx="8" fill="url(#ai)"/>
  <text class="val" x="438" y="474">약 1.7</text>
  <text class="sub" x="510" y="474">하루 100회 × 30일 × 1환경</text>

  <!-- 오른쪽 요약 -->
  <rect x="790" y="86" width="370" height="200" rx="18" fill="url(#bar)" fill-opacity="0.12" stroke="#F5B83D" stroke-opacity="0.6"/>
  <text x="818" y="126" font-size="16" font-weight="700" fill="#FFD98A">고정비 합계</text>
  <text x="818" y="196" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-1">약 6</text>
  <text x="944" y="196" font-size="20" font-weight="700" fill="#FFD98A">USD/월</text>
  <text class="sub" x="818" y="236">도메인과 main을 켜면 약 12~13.</text>
  <text class="sub" x="818" y="260">인스턴스를 멈춰도 요금은 나간다.</text>

  <rect class="card" x="790" y="306" width="370" height="264" rx="18"/>
  <text x="818" y="344" font-size="16" font-weight="700">예산 알림</text>
  <text class="sub" x="818" y="376">계정 전체</text>
  <text class="val" x="1132" y="376" text-anchor="end">20 USD</text>
  <!-- 20 USD = 316px -->
  <rect x="818" y="390" width="316" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="818" y="390" width="95" height="22" rx="11" fill="url(#bar)"/>
  <rect x="905" y="390" width="166" height="22" fill="url(#ai)"/>
  <text class="sub" x="818" y="436">고정비 6</text>
  <text class="sub" x="960" y="436">Bedrock 10</text>

  <text class="sub" x="818" y="476">Bedrock 전용</text>
  <text class="val" x="1132" y="476" text-anchor="end">10 USD</text>
  <rect x="818" y="490" width="316" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="818" y="490" width="54" height="22" rx="11" fill="url(#hatchAi)"/>
  <text class="sub" x="818" y="540">상한 1.7 추정 · 100% 넘으면</text>
  <text class="sub" x="818" y="558">거부 정책 자동 부착(선택)</text>
</svg>
