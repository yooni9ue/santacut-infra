<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="보안과 환경 격리 계층. OIDC 역할 4종(5개)과 6단계 방어, IAM으로 막지 못하는 위험">
  <title>보안과 환경 격리 계층. OIDC 역할 4종(5개)과 6단계 방어, IAM으로 막지 못하는 위험</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1B2E"/><stop offset="0.62" stop-color="#0B1D2D"/><stop offset="1" stop-color="#0B2422"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4C4D8"/>
    </marker>
    <marker id="arrLater" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8DA3BE"/>
    </marker>
    <symbol id="flake" viewBox="-10 -10 20 20" overflow="visible"><g fill="none" stroke-width="1.3" stroke-linecap="round"><g transform="rotate(0)"><path d="M0,-9 V9"/><path d="M-2.6,-7.4 L0,-5 L2.6,-7.4"/><path d="M-2.6,7.4 L0,5 L2.6,7.4"/></g><g transform="rotate(60)"><path d="M0,-9 V9"/><path d="M-2.6,-7.4 L0,-5 L2.6,-7.4"/><path d="M-2.6,7.4 L0,5 L2.6,7.4"/></g><g transform="rotate(120)"><path d="M0,-9 V9"/><path d="M-2.6,-7.4 L0,-5 L2.6,-7.4"/><path d="M-2.6,7.4 L0,5 L2.6,7.4"/></g></g></symbol>
    
    <style>
      text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', system-ui, sans-serif; }
      text:not([fill]) { fill: #F5F8FC; }
      .card { fill: #12263F; stroke: #1E3A5C; stroke-width: 1.5; }
      .inner { fill: #183152; stroke: #2B4A70; stroke-width: 1; }
      .ghost { fill: #0C1B2E; stroke: #8DA3BE; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .h { font-size: 17px; font-weight: 700; }
      .s { font-size: 14px; fill: #B4C4D8; }
      .xs { font-size: 14px; fill: #B4C4D8; }
      .code { font-family: ui-monospace, 'SF Mono', 'D2Coding', Consolas, 'Liberation Mono', monospace; font-size: 14px; fill: #8ECDF5; }
      .line { stroke: #B4C4D8; stroke-width: 2; fill: none; }
      .later { stroke: #8DA3BE; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
      
    </style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <path d="M0,696 Q300,680 600,692 T1200,690 V696 A24,24 0 0 1 1176,720 H24 A24,24 0 0 1 0,696 z" fill="#F5F8FC" opacity="0.05"/>
  <g fill="#F5F8FC"><circle cx="1150" cy="96" r="1.4" opacity="0.35"/><circle cx="448" cy="110" r="1.2" opacity="0.3"/><circle cx="24" cy="380" r="1.3" opacity="0.3"/></g>
  <path d="M40,0 H64 V56 L52,47 L40,56 z" fill="#B5123E"/>
  <path d="M43.5,0 V50 M60.5,0 V50" stroke="#E9B949" stroke-width="1" opacity="0.75"/>
  <text x="82" y="48" font-size="28" font-weight="800">보안·격리</text>
  <text x="1160" y="48" text-anchor="end" font-size="16" fill="#B4C4D8">같은 계정 안에서 dev와 main을 IAM으로 가른다</text>
  <text x="40" y="122" font-size="15" font-weight="800" fill="#B4C4D8">OIDC 역할 4종(5개)</text>
  <g transform="translate(40,140)">
    <rect class="card" width="380" height="96" rx="14"/>
    <rect width="6" height="96" rx="3" fill="#8ECDF5"/>
    <text class="code" x="24" y="32">santacut-terraform-plan</text>
    <text class="h" x="24" y="60">PR, main 브랜치</text>
    <text class="s" x="24" y="82">읽기 전용, 잠금 파일만 쓴다</text>
  </g><g transform="translate(40,250)">
    <rect class="card" width="380" height="96" rx="14"/>
    <rect width="6" height="96" rx="3" fill="#4CC38A"/>
    <text class="code" x="24" y="32">santacut-terraform-apply-dev</text>
    <text class="h" x="24" y="60">dev Environment에서만</text>
    <text class="s" x="24" y="82">자기 상태 키, 자기 접두사 리소스</text>
  </g><g transform="translate(40,360)">
    <rect class="card" width="380" height="96" rx="14"/>
    <rect width="6" height="96" rx="3" fill="#FF7A93"/>
    <text class="code" x="24" y="32">santacut-terraform-apply-main</text>
    <text class="h" x="24" y="60">main Environment에서만</text>
    <text class="s" x="24" y="82">필수 승인자를 통과해야 맡는다</text>
  </g><g transform="translate(40,470)">
    <rect class="card" width="380" height="96" rx="14"/>
    <rect width="6" height="96" rx="3" fill="#E9B949"/>
    <text class="code" x="24" y="32">santacut-app-deploy-&lt;env&gt;</text>
    <text class="h" x="24" y="60">앱 레포 배포 워크플로</text>
    <text class="s" x="24" y="82">자기 환경 인스턴스의 포트 열기·닫기만</text>
  </g>
  <path d="M432,353 H470" stroke="#B4C4D8" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="480" y="122" font-size="15" font-weight="800" fill="#B4C4D8">방어 계층</text>
  <g transform="translate(480,140)">
    <rect class="card" width="680" height="64" rx="14"/>
    <circle cx="32" cy="32" r="15" fill="#8ECDF5"/><text x="32" y="38" text-anchor="middle" font-size="15" font-weight="800" fill="#08121F">1</text>
    <text class="h" x="62" y="28">Environment 태그 거부</text>
    <text class="s" x="62" y="50">다른 환경 태그의 Lightsail 인스턴스 조작은 거부</text>
  </g><g transform="translate(480,214)">
    <rect class="card" width="680" height="64" rx="14"/>
    <circle cx="32" cy="32" r="15" fill="#82CDE0"/><text x="32" y="38" text-anchor="middle" font-size="15" font-weight="800" fill="#08121F">2</text>
    <text class="h" x="62" y="28">Route 53 레코드 이름 조건</text>
    <text class="s" x="62" y="50">자기 환경 도메인의 A 레코드만 바꾼다(도메인이 있을 때)</text>
  </g><g transform="translate(480,288)">
    <rect class="card" width="680" height="64" rx="14"/>
    <circle cx="32" cy="32" r="15" fill="#76CBC6"/><text x="32" y="38" text-anchor="middle" font-size="15" font-weight="800" fill="#08121F">3</text>
    <text class="h" x="62" y="28">환경별 권한 경계</text>
    <text class="s" x="62" y="50">앱 사용자 상한: 자기 백업 버킷·KMS 키</text>
  </g><g transform="translate(480,362)">
    <rect class="card" width="680" height="64" rx="14"/>
    <circle cx="32" cy="32" r="15" fill="#6AC8AE"/><text x="32" y="38" text-anchor="middle" font-size="15" font-weight="800" fill="#08121F">4</text>
    <text class="h" x="62" y="28">SSH는 운영자 CIDR만</text>
    <text class="s" x="62" y="50">배포 동안만 러너 IP에 22번을 열고, 끝나면 닫는다</text>
  </g><g transform="translate(480,436)">
    <rect class="card" width="680" height="64" rx="14"/>
    <circle cx="32" cy="32" r="15" fill="#5CC59C"/><text x="32" y="38" text-anchor="middle" font-size="15" font-weight="800" fill="#08121F">5</text>
    <text class="h" x="62" y="28">IPv4 전용</text>
    <text class="s" x="62" y="50">IPv6 방화벽은 기본 전체 허용이라 쓰지 않는다</text>
  </g><g transform="translate(480,510)">
    <rect class="card" width="680" height="64" rx="14"/>
    <circle cx="32" cy="32" r="15" fill="#4CC38A"/><text x="32" y="38" text-anchor="middle" font-size="15" font-weight="800" fill="#08121F">6</text>
    <text class="h" x="62" y="28">비밀값은 코드·상태 밖</text>
    <text class="s" x="62" y="50">앱 설정은 KMS로 암호화해 S3에, 액세스 키는 인스턴스에만</text>
  </g>
  <g transform="translate(1146,114) scale(0.6)">
    <path d="M0,-22 L22,-14 V4 C22,18 12,26 0,32 C-12,26 -22,18 -22,4 V-14 z" fill="#4CC38A"/>
    <path d="M-8,4 l6,6 l11,-12" fill="none" stroke="#08121F" stroke-width="3"/>
  </g>
  <g transform="translate(40,598)">
    <rect width="1120" height="92" rx="16" fill="#E9B949" fill-opacity="0.10" stroke="#E9B949" stroke-opacity="0.6"/>
    <path d="M30,24 L48,56 H12 z" fill="#E9B949"/>
    <rect x="28.5" y="34" width="3" height="11" fill="#08121F"/><rect x="28.5" y="48" width="3" height="3" fill="#08121F"/>
    <text x="66" y="38" font-size="17" font-weight="800" fill="#F7DE9F">IAM으로 막지 못하는 위험도 적어 둔다</text>
    <text class="s" x="66" y="66">고정 IP, 애드온, 키 페어 가져오기는 환경별 조건이 없다. Environment 브랜치 제한과 PR 리뷰로 막는다.</text>
  </g>
</svg>
