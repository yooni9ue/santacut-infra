<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="santacut-infra 배너">
  <title>santacut-infra</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1426"/>
      <stop offset="0.55" stop-color="#10233A"/>
      <stop offset="1" stop-color="#0E2E2A"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFE9FF"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5A5F"/>
      <stop offset="1" stop-color="#F5B83D"/>
    </linearGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3DDC97"/>
      <stop offset="1" stop-color="#1F8F5F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.4" r="0.45">
      <stop offset="0" stop-color="#F5B83D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F5B83D" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif; }
      .chip { fill: #FFFFFF; fill-opacity: 0.08; stroke: #FFFFFF; stroke-opacity: 0.18; }
      .chipt { fill: #E6EDF7; font-size: 16px; font-weight: 600; }
      .snow { fill: #FFFFFF; }
    </style>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow)"/>
  <g class="snow">
    <circle cx="60" cy="40" r="2.5" opacity="0.7"/><circle cx="140" cy="90" r="1.6" opacity="0.5"/>
    <circle cx="230" cy="30" r="2" opacity="0.6"/><circle cx="380" cy="60" r="1.4" opacity="0.4"/>
    <circle cx="520" cy="26" r="2.2" opacity="0.6"/><circle cx="640" cy="70" r="1.5" opacity="0.4"/>
    <circle cx="760" cy="34" r="2" opacity="0.5"/><circle cx="1150" cy="50" r="2.4" opacity="0.6"/>
    <circle cx="1100" cy="280" r="1.8" opacity="0.5"/><circle cx="700" cy="290" r="1.4" opacity="0.35"/>
    <circle cx="880" cy="270" r="2" opacity="0.4"/><circle cx="40" cy="270" r="1.8" opacity="0.4"/>
    <circle cx="1170" cy="160" r="1.5" opacity="0.5"/><circle cx="600" cy="140" r="1.2" opacity="0.3"/>
  </g>
  <rect x="64" y="70" width="56" height="6" rx="3" fill="url(#red)"/>
  <text x="64" y="140" font-size="60" font-weight="800" fill="url(#title)" letter-spacing="-1">santacut-infra</text>
  <text x="64" y="184" font-size="24" font-weight="500" fill="#C9D6E8">산타컷 서비스의 AWS 인프라를 Terraform으로 관리한다.</text>
  <g transform="translate(64,222)">
    <rect class="chip" width="150" height="38" rx="19"/><text class="chipt" x="75" y="25" text-anchor="middle">Terraform 1.17</text>
    <rect class="chip" x="164" width="160" height="38" rx="19"/><text class="chipt" x="244" y="25" text-anchor="middle">AWS Lightsail</text>
    <rect class="chip" x="338" width="190" height="38" rx="19"/><text class="chipt" x="433" y="25" text-anchor="middle">Bedrock · Haiku 5.5</text>
    <rect class="chip" x="542" width="160" height="38" rx="19"/><text class="chipt" x="622" y="25" text-anchor="middle">GitHub OIDC</text>
  </g>
  <!-- 서버 랙으로 만든 트리 -->
  <g transform="translate(960,50)">
    <polygon points="70,0 77,16 95,17 81,28 86,46 70,36 54,46 59,28 45,17 63,16" fill="#F5B83D"/>
    <rect x="35" y="58" width="70" height="40" rx="10" fill="url(#tree)"/>
    <rect x="15" y="106" width="110" height="44" rx="11" fill="url(#tree)"/>
    <rect x="-5" y="158" width="150" height="48" rx="12" fill="url(#tree)"/>
    <g fill="#0B1426" opacity="0.55">
      <rect x="47" y="74" width="34" height="6" rx="3"/>
      <rect x="29" y="124" width="58" height="6" rx="3"/>
      <rect x="9" y="178" width="84" height="6" rx="3"/>
    </g>
    <circle cx="92" cy="77" r="5" fill="#FF5A5F"/>
    <circle cx="108" cy="127" r="5" fill="#5CC8FF"/>
    <circle cx="126" cy="181" r="5" fill="#FF5A5F"/>
    <circle cx="112" cy="181" r="5" fill="#F5B83D"/>
    <rect x="58" y="206" width="24" height="18" rx="4" fill="#7A4B2A"/>
  </g>
