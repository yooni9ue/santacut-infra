# 트렁크 기반: PR에서 두 환경 plan → main 병합 후 dev 적용 → 운영 plan 저장 → 승인 → 저장된 plan 적용.
name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 운영 적용 순서를 지키려고 실행을 하나씩 처리한다. 승인 대기가 오래된 실행은 거절하고 새 실행으로 진행한다.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.17.1
  AWS_REGION: ap-northeast-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # TF_VAR_* 값은 plan/apply 잡에만 넣는다. 레포 변수가 비어 있으면 빈 문자열이 목록 변수 해석을 깨뜨려 검사 잡까지 실패한다.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: 형식 검사
        run: terraform fmt -check -recursive
      - name: 문법 검사
        run: |
          for d in bootstrap envs/dev envs/main; do
            terraform -chdir="$d" init -backend=false -lockfile=readonly
            terraform -chdir="$d" validate
          done
      - name: 모듈 테스트(모의 프로바이더)
        run: |
          terraform -chdir=modules/santacut_app init -backend=false -lockfile=readonly
          terraform -chdir=modules/santacut_app test

  plan:
    # 레포 변수(docs/operations.md 4단계)를 넣기 전에는 AWS 잡을 건너뛴다.
    if: github.event_name == 'pull_request' && vars.TF_STATE_BUCKET != ''
    needs: check
    runs-on: ubuntu-latest
    env:
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_ssh_allowed_cidrs: ${{ vars.SSH_ALLOWED_CIDRS }}
      TF_VAR_bedrock_model_id: ${{ vars.BEDROCK_MODEL_ID }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        env: [dev, main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: plan (${{ matrix.env }})
        working-directory: envs/${{ matrix.env }}
        run: |
          terraform init -lockfile=readonly -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform plan -lock-timeout=5m -no-color

  # 레포 변수 DEV_ENABLED를 false로 두면 dev 적용을 건너뛴다(dev를 내렸을 때).
  apply-dev:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEV_ENABLED != 'false' && vars.TF_STATE_BUCKET != ''
    needs: check
    runs-on: ubuntu-latest
    env:
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_ssh_allowed_cidrs: ${{ vars.SSH_ALLOWED_CIDRS }}
      TF_VAR_bedrock_model_id: ${{ vars.BEDROCK_MODEL_ID }}
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: apply (dev)
        working-directory: envs/dev
        run: |
          terraform init -lockfile=readonly -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -auto-approve -lock-timeout=5m -no-color

  # 승인 전에 운영 plan을 만들어 실행 요약에 보여 주고, 승인 후에는 이 plan 그대로 적용한다.
  plan-main:
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      vars.TF_STATE_BUCKET != '' &&
      needs.check.result == 'success' &&
      (needs.apply-dev.result == 'success' || needs.apply-dev.result == 'skipped')
    needs: [check, apply-dev]
    runs-on: ubuntu-latest
    env:
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_ssh_allowed_cidrs: ${{ vars.SSH_ALLOWED_CIDRS }}
      TF_VAR_bedrock_model_id: ${{ vars.BEDROCK_MODEL_ID }}
    permissions:
      contents: read
      id-token: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: plan (main)
        id: plan
        working-directory: envs/main
        run: |
          terraform init -lockfile=readonly -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          set +e
          terraform plan -lock-timeout=5m -no-color -detailed-exitcode -out=tfplan
          code=$?
          set -e
          [ "$code" -eq 1 ] && exit 1
          echo "has_changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "## 운영(main) plan"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.has_changes == 'true'
        with:
          name: tfplan-main
          path: envs/main/tfplan
          retention-days: 7

  apply-main:
    if: always() && needs.plan-main.result == 'success' && needs.plan-main.outputs.has_changes == 'true'
    needs: plan-main
    runs-on: ubuntu-latest
    env:
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_ssh_allowed_cidrs: ${{ vars.SSH_ALLOWED_CIDRS }}
      TF_VAR_bedrock_model_id: ${{ vars.BEDROCK_MODEL_ID }}
    # main Environment에 필수 승인자를 걸어 둔다. 승인자는 plan-main 실행 요약의 plan을 보고 승인한다.
    environment: main
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-main
          path: envs/main
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: apply (main, 승인된 plan)
        working-directory: envs/main
        run: |
          terraform init -lockfile=readonly -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -lock-timeout=5m -no-color tfplan
